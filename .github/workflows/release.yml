# Publish a GitHub release of the AmigaCD core, as a complete package, with a
# changelog. ON DEMAND ONLY.
#
# Started by hand from Actions -> release -> Run workflow, and by nothing else:
# workflow_dispatch is its only trigger, so no push or pull request ever
# publishes. A release is a promise to whoever downloads it.
#
# The core is only one of three things a working AmigaCD needs, so the release
# carries all three, each at its latest published release:
#   AmigaCD_<date>.rbf  this repository: the fit committed under releases/
#   MiSTer_AmigaCD      FringeCoder/AmigaCD, the userspace binary
#   menu.rbf            FringeCoder/Menu_MiSTer, the menu core with the SNAC reader
# "Latest" is GitHub's: the newest release that is not a draft or a
# pre-release. Either can be pinned with the inputs below. If one of them has
# no release, nothing is published -- an incomplete package is the thing this
# exists to stop.
#
# The .rbf is not built here -- Quartus is not in CI, and the fit needs the
# seed sweeps in seed_sweep.sh to close timing. It is the fit you commit as
# releases/AmigaCD_YYYYMMDD.rbf.
#
#   guard    default branch only; the newest releases/AmigaCD_*.rbf; the tag
#            (v<that date> unless given); refuses a tag that exists, and an rbf
#            the previous release already shipped
#   ci       rtl-sim.yml itself, called: the syntax gate and every bench must
#            pass, or nothing is published
#   publish  fetches the other two releases, builds the package, writes the
#            changelog, and creates the tag and the release
#
# docs/releasing.md has the how-to.
name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag, e.g. v20261016. Empty: v<date of the newest releases/AmigaCD_*.rbf>. Must not exist yet.'
        required: false
        default: ''
      amigacd_tag:
        description: 'FringeCoder/AmigaCD release to bundle. Empty: its latest.'
        required: false
        default: ''
      menu_tag:
        description: 'FringeCoder/Menu_MiSTer release to bundle. Empty: its latest.'
        required: false
        default: ''
      prerelease:
        description: 'Mark as a pre-release (a build for testing, not for everyone)'
        type: boolean
        default: false
      notes:
        description: 'Optional text shown above the generated changelog'
        required: false
        default: ''

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  RBF_PREFIX: AmigaCD_
  USERSPACE_REPO: FringeCoder/AmigaCD
  MENU_REPO: FringeCoder/Menu_MiSTer

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      rbf: ${{ steps.pick.outputs.rbf }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Only from the default branch
        env:
          REF: ${{ github.ref_name }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$REF" != "$DEFAULT" ]; then
            echo "::error::Releases are made from $DEFAULT only; this run is on $REF."
            exit 1
          fi

      # Inputs reach the shell through env only, so they cannot inject.
      - name: Pick the core and the tag
        id: pick
        env:
          TAG_IN: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # Dated names sort by date, and a glob expands sorted: the last match
          # is the newest.
          rbf=""
          for f in releases/"$RBF_PREFIX"[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9].rbf; do
            [ -e "$f" ] && rbf="${f#releases/}"
          done
          if [ -z "$rbf" ]; then
            echo "::error::No releases/${RBF_PREFIX}YYYYMMDD.rbf is committed. Commit the fit first."
            exit 1
          fi
          # A Git LFS pointer or a truncated copy is a few hundred bytes; a real
          # bitstream is megabytes.
          size="$(stat -c %s "releases/$rbf")"
          if [ "$size" -lt 500000 ]; then
            echo "::error::releases/$rbf is only $size bytes; that is not a fitted core."
            exit 1
          fi
          date="${rbf#"$RBF_PREFIX"}"; date="${date%.rbf}"
          tag="${TAG_IN:-v$date}"
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9A-Za-z._-]+$'; then
            echo "::error::Tag '$tag' must start with v and use only letters, digits, . _ -"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::Tag $tag already exists. Pass another, e.g. $tag.1"
            exit 1
          fi
          # Re-releasing the same bitstream under a new tag would read as an
          # update and be none. (To ship a new userspace or menu with the same
          # core, re-release those; the next core release picks them up.)
          prev="$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD 2>/dev/null || true)"
          if [ -n "$prev" ] && git cat-file -e "$prev:releases/$rbf" 2>/dev/null; then
            echo "::error::releases/$rbf was already in $prev. Commit a new fit to release."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "rbf=$rbf" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag: releases/$rbf ($size bytes), previous ${prev:-none}"

  ci:
    needs: guard
    uses: ./.github/workflows/rtl-sim.yml

  publish:
    needs: [guard, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Both repositories are public, so this run's own token reads their
      # releases. AMIGACD_RELEASE_TOKEN is used instead when set: a read-only
      # token for the day either one is private again. The error says which.
      - name: Fetch the userspace and menu releases
        id: deps
        env:
          GH_TOKEN: ${{ secrets.AMIGACD_RELEASE_TOKEN || github.token }}
          AMIGACD_TAG: ${{ inputs.amigacd_tag }}
          MENU_TAG: ${{ inputs.menu_tag }}
        run: |
          set -euo pipefail
          mkdir -p deps/userspace deps/menu
          # Prints only the resolved tag on stdout, so it can be captured;
          # everything else goes to stderr, where the log shows it.
          fetch() {   # fetch <repo> <tag or empty> <dir> <asset>
            local repo=$1 tag=$2 dir=$3 asset=$4 t
            if ! t="$(gh release view ${tag:+"$tag"} --repo "$repo" --json tagName -q .tagName 2>&1)"; then
              echo "::error::No ${tag:-latest} release of $repo to bundle ($t). Publish one there first (its release workflow), or check that $repo is public or AMIGACD_RELEASE_TOKEN is set." >&2
              return 1
            fi
            gh release download "$t" --repo "$repo" --pattern "$asset" --dir "$dir" >&2
            if [ ! -s "$dir/$asset" ]; then
              echo "::error::$repo release $t has no $asset." >&2
              return 1
            fi
            echo "$t"
          }
          us="$(fetch "$USERSPACE_REPO" "$AMIGACD_TAG" deps/userspace MiSTer_AmigaCD)"
          mn="$(fetch "$MENU_REPO" "$MENU_TAG" deps/menu menu.rbf)"
          echo "userspace=$us" >> "$GITHUB_OUTPUT"
          echo "menu=$mn" >> "$GITHUB_OUTPUT"
          echo "Bundling $USERSPACE_REPO $us and $MENU_REPO $mn"

      # The package is laid out as the SD card is (docs/deployment.md in
      # FringeCoder/AmigaCD), so unzipping it into /media/fat/ installs it.
      # The core keeps its dated name: the menu shows the date from it, and
      # bootcore picks the newest <core>_YYYYMMDD.rbf by it.
      - name: Build the package
        env:
          TAG: ${{ needs.guard.outputs.tag }}
          RBF: ${{ needs.guard.outputs.rbf }}
          US_TAG: ${{ steps.deps.outputs.userspace }}
          MENU_TAG: ${{ steps.deps.outputs.menu }}
        run: |
          set -euo pipefail
          pkg="pkg/AmigaCD_$TAG"
          mkdir -p "$pkg/_Computer" dist
          cp "releases/$RBF" "$pkg/_Computer/$RBF"
          cp deps/userspace/MiSTer_AmigaCD "$pkg/MiSTer_AmigaCD"
          chmod +x "$pkg/MiSTer_AmigaCD"
          cp deps/menu/menu.rbf "$pkg/menu.rbf"
          cat > "$pkg/INSTALL.txt" <<TXT
          AmigaCD $TAG

            _Computer/$RBF   the core              ($GITHUB_REPOSITORY $TAG)
            MiSTer_AmigaCD   the userspace binary  ($USERSPACE_REPO $US_TAG)
            menu.rbf         the menu core         ($MENU_REPO $MENU_TAG)

          1. Copy everything here to the root of the SD card (/media/fat/),
             keeping the folders. Keep a copy of your old menu.rbf first: a
             menu core that does not boot leaves the MiSTer with no menu.
          2. Add to /media/fat/MiSTer.ini:

               [AmigaCD]
               main=MiSTer_AmigaCD

          3. Kickstart ROMs are not included and never will be. See the
             AmigaCD README for the file names each machine looks for.
          TXT
          (cd pkg && zip -r -X "../dist/AmigaCD_${TAG}.zip" "AmigaCD_$TAG")
          # The parts on their own too, for updating one piece.
          cp "releases/$RBF" "dist/$RBF"
          cp deps/userspace/MiSTer_AmigaCD dist/MiSTer_AmigaCD
          cp deps/menu/menu.rbf dist/menu.rbf
          (cd dist && sha256sum -- * > SHA256SUMS)
          unzip -l "dist/AmigaCD_${TAG}.zip"
          cat dist/SHA256SUMS

      - name: Write the changelog
        env:
          TAG: ${{ needs.guard.outputs.tag }}
          RBF: ${{ needs.guard.outputs.rbf }}
          NOTES: ${{ inputs.notes }}
          REPO: ${{ github.repository }}
          US_TAG: ${{ steps.deps.outputs.userspace }}
          MENU_TAG: ${{ steps.deps.outputs.menu }}
        run: |
          set -euo pipefail
          prev="$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD 2>/dev/null || true)"
          # shellcheck disable=SC2016  # the backticks are Markdown, not expansions
          {
            if [ -n "$NOTES" ]; then printf '%s\n\n' "$NOTES"; fi
            printf '### In this package\n\n'
            printf '| | |\n|---|---|\n'
            printf '| `%s` | this release |\n' "$RBF"
            printf '| `MiSTer_AmigaCD` | [%s %s](https://github.com/%s/releases/tag/%s) |\n' "$USERSPACE_REPO" "$US_TAG" "$USERSPACE_REPO" "$US_TAG"
            printf '| `menu.rbf` | [%s %s](https://github.com/%s/releases/tag/%s) |\n' "$MENU_REPO" "$MENU_TAG" "$MENU_REPO" "$MENU_TAG"
            printf '\nThose two releases carry their own changelogs. This one is the core:\n\n'
            python3 scripts/release-notes.py "$prev" "$GITHUB_SHA" --repo "$REPO" | sed 's/^### /#### /; s/^## /### /'
            printf '\n### Install\n\n'
            printf 'Unzip `AmigaCD_%s.zip` and copy its contents to the root of the SD card, then add\n' "$TAG"
            printf '`[AmigaCD]` / `main=MiSTer_AmigaCD` to `MiSTer.ini`; `INSTALL.txt` in the zip has the steps. '
            printf 'Keep your old `menu.rbf`. Kickstart ROMs are not included.\n\n'
            printf 'Core built from %s.\n' "$GITHUB_SHA"
          } > dist/NOTES.md
          cat dist/NOTES.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.guard.outputs.tag }}
          RBF: ${{ needs.guard.outputs.rbf }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          args=()
          if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "AmigaCD $TAG" \
            --notes-file dist/NOTES.md \
            "${args[@]}" \
            "dist/AmigaCD_${TAG}.zip" "dist/$RBF" dist/MiSTer_AmigaCD dist/menu.rbf dist/SHA256SUMS
