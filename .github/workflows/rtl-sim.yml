# Run the RTL testbenches that already exist in rtl/sim/ on every push.
#
# These benches ship with ModelSim .do runners, and ModelSim is not installed on
# the dev machine -- so in practice they were never run, including through an
# entire session of changes to sdram_ctrl.v. Icarus runs both of these fine, so
# there is no reason for them to be manual.
#
# Nine of the ten bench directories in rtl/sim/ run here. rtl/sim/chipset is the
# holdout -- it is ModelSim-only and has not been ported to Icarus. Add benches
# as they are confirmed to run rather than committing a red pipeline.
#
# The first two steps are gates rather than benches: a standalone parse of every
# synthesisable source, and an assertion that the CIA CNT revert is still in
# place. Both exist because the pipeline should refuse things that people would
# otherwise have to remember.
name: rtl-sim

on:
  push:
  pull_request:
  workflow_dispatch:
  # release.yml calls this, so a release is gated on the same syntax gate and
  # benches as every push. Being callable publishes nothing by itself.
  workflow_call:

jobs:
  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # An upload-artifact step with no retention-days keeps the repository
      # default and never expires. 493 such artifacts filled the 500 MB quota
      # on 2026-09-28, and a full quota fails the upload step -- so every
      # build fails, including on a docs-only PR that touches no code. That
      # looks like a broken build and sends you looking in the wrong place.
      # Cheaper to refuse the step than to diagnose it again.
      # A bench nobody runs is worse than no bench: it reads as coverage.
      # tb_akiko_txrx_dma failed 36 of its 48 checks for months because its
      # akiko instance predated dma_arm and nothing ran it; tb_ss_regbus_mux was
      # red across four PRs for a narrow-port bug Icarus only warns about.
      - name: Every bench is run by something
        run: |
          set -euo pipefail
          python3 rtl/sim/check-benches-wired.py

      - name: Artifact uploads must set retention-days
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          python3 .github/check-artifact-retention.py

      - name: Install Icarus Verilog and GHDL
        run: sudo apt-get update && sudo apt-get install -y iverilog ghdl

      # Parse every synthesisable source standalone. Nothing else in this
      # workflow ever parses AmigaCD.sv, and most of rtl/ is never parsed at
      # all, so a plain syntax error otherwise passes CI in full and surfaces
      # only 18 seconds into a 35-minute Quartus fit. Seconds of runtime, and it
      # fails the cheap way. See syntax_check.sh for what it does and does not
      # treat as an error.
      - name: Verilog syntax gate
        run: |
          set -euo pipefail
          bash syntax_check.sh

      # rtl/snac_psx.v is a copy. FringeCoder/AmigaCD owns it, and a shared file
      # with no stamp is a file that diverges silently -- two of the ten modules
      # this repository shares with that one already have. This catches the copy
      # being edited HERE, which is the common case and the cheap one: the fix is
      # to move the edit to the canonical repo and re-vendor.
      #
      # It cannot catch the canonical side moving; that needs a checkout of the
      # other repository, which CI has no token for. Deliberately a hard local
      # check rather than a cross-repo one that degrades to "skipped" when a
      # secret is absent. FringeCoder/Menu_MiSTer runs this same check on its own
      # copy, against the same stamp.
      #
      # If this fails, do NOT delete it as stale or restamp to make it green.
      # See rtl/snac_psx.vendor.
      # Break one thing each bench claims to catch and require it to go red, BY
      # THE CHECK THAT CLAIMS IT. tb_akiko_txrx_dma test D asserted nothing for
      # months -- its floor sat below the engine's own latency, so deleting the
      # inhibit left all 48 checks green. Widening a window is routine and every
      # such edit is a chance to make a check vacuous, so this runs on every push.
      #
      # Must come AFTER the Icarus install: it compiles. It was first placed
      # before it, so every mutation reported a compile error and the step failed
      # for a reason that had nothing to do with the benches.
      - name: The benches can still fail
        run: |
          set -euo pipefail
          python3 rtl/sim/run-mutations.py

      - name: snac_psx.v matches its vendor stamp
        run: |
          set -euo pipefail
          ./snac_vendor_check.sh

      # The CIA CNT revert is permanent and will be re-applied on every future
      # Minimig-AGA sync, so it needs a control rather than a memory.
      #
      # Upstream b013ce3 added the Timer A/B INMODE count-source selects but not
      # the wiring: minimig.v drives both CIAs with .cnt_in(1'b1), so cnt_rise
      # never pulses and selecting a CNT source stops the timer dead. It broke
      # Flink. Reverted 2026-08-27, and again 2026-08-31 when a merge brought it
      # back -- forgotten once already, between two syncs five days apart.
      #
      # The failure is near-silent: a title starts and then hangs with every
      # data path healthy, which is the hardest possible thing to attribute.
      #
      # If this step fails, do NOT delete it as stale. It means a merge has
      # re-applied b013ce3. Re-revert rtl/cia_timera.v and rtl/cia_timerb.v to
      # the eclk forms below, or wire CNT properly first.
      - name: CIA count source is eclk (guards the b013ce3 revert)
        run: |
          set -euo pipefail
          fail=0
          # The eclk forms, gated by the start-up delay ported from upstream
          # 2bddf21 -- which is a timing detail of the E-clock source, not a
          # second source. What must never come back is cnt_rise / tmcr[5].
          grep -qF "assign count = eclk & start_delay[1];" rtl/cia_timera.v || {
            echo "rtl/cia_timera.v: timer A count source is not the eclk form"; fail=1; }
          grep -qF "assign count = tmcr[6] ? tmra_ovf : (eclk & start_delay[1]);" rtl/cia_timerb.v || {
            echo "rtl/cia_timerb.v: timer B count source is not the eclk form"; fail=1; }
          if grep -nE "cnt_rise|cnt_sync" rtl/cia_timera.v rtl/cia_timerb.v; then
            echo "a CNT-pin count source is back in the CIA timers"; fail=1; fi
          if [ "$fail" -ne 0 ]; then
            echo
            echo "The CIA CNT revert has been undone. See the comment above this"
            echo "step in .github/workflows/rtl-sim.yml before changing anything."
            exit 1
          fi

      # sdram_ctrl's chip-read burst path, store-to-load forwarding and byte-enable
      # merging. Waits on dut.sdram_state == 0, so it also covers the registered
      # state decode that the sd_addr retiming introduced -- a wrong decode means
      # the CHIP slot never loads chipAddr and the baseline reads come back garbage.
      - name: SDRAM store-to-load forwarding
        run: |
          set -euo pipefail
          cd rtl/sim/sdram
          # ModelSim needs declaration-before-use; this regenerates the reordered
          # copy from the real sdram_ctrl.v. Behaviour-identical, sim only.
          python3 make_sim_sdram.py
          iverilog -g2012 -o tb_fwd \
            dpram_sim.v ../../cpu_cache_new.v sdram_ctrl_sim.v tb_sdram_fwd.sv
          vvp tb_fwd | tee out.log
          grep -q "RUN: PASS" out.log

      # ddram_ctrl's read-return acceptance. Avalon lets a slave hold
      # waitrequest while pulsing readdatavalid; state 1 used to wait for both
      # to be favourable, so a return landing on a busy cycle was dropped and
      # master 0 wedged for good -- a 68k stalled on a fast-RAM fetch, which is
      # what Z2 fast RAM + a mounted CD looked like from outside.
      #
      # The bench drives both clients of that state (CPU cache fill, bridge DMA
      # read) against a slave model that asserts waitrequest exactly on its
      # return cycles, and separately constructs the save-state grant edge,
      # where a read can be parked with ss owning master 0. Falsified three
      # ways on 2026-09-14: the original condition hangs both clients, the
      # unqualified fix feeds the save state payload into a CPU cache fill, and
      # the shipped form passes. Do NOT simplify the condition back to either.
      #
      # Since upstream 26eb46a the controller posts CPU writes into a queue and
      # reads two-beat bursts through a stream buffer. The slave model returns
      # every beat of a burst, and check 5 holds a posted write in the queue
      # while the port is asked for: the grant must wait until it is in DDR3.
      # Falsified 2026-10-16 by dropping ~wq_any from ss_ram_idle (16 of 16
      # grants then came with the write still queued). Check 8 covers the
      # stream buffer's ~ss_port_own on its return: no input sequence reaches
      # it any more, so it plants an owed buffer read under ss ownership.
      # Falsified by dropping the guard (the buffer then takes ss's beat).
      #
      # Checks 4, 6 and 7 are the grant itself, after a review found three ways
      # a save or restore could hang or be refused: a request armed on the
      # freeze edge was pinned forever (check 6), one armed on the grant edge
      # was held for the whole ownership with ss_ram_idle low (check 4), and a
      # restore could be granted before the CPU parked (check 7). Falsified
      # 2026-10-16 by undoing each fix: 2010 duplicate writes and no grant; 102
      # owned cycles with idle low; a grant with the CPU still running.
      - name: DDR3 read return under waitrequest
        run: |
          set -euo pipefail
          cd rtl/sim/ddram
          iverilog -g2012 -o tb ../../ddram_ctrl.v ../../ddr_cmd_pipe.v \
            ../../cpu_cache_new.v \
            ../../A2065/a2065_ddram_arbiter.v ../cache/dpram_sim.v \
            tb_ddram_readreturn.sv
          vvp tb | tee out.log
          grep -q "RUN: PASS" out.log

      # ddram_ctrl's write-queue drain takes e_drop from a per-entry precompute
      # (wq_inbuf[wq_h]) instead of in_buf() on the muxed-out head, one mux
      # level off wq_a -> sb_kill / sc_kill (a setup miss after 26eb46a). The
      # step above never makes in_buf true, so it cannot show the two agree.
      # This writes random stream-buffer and write-queue state straight into
      # the module, with colliding addresses, and compares its own wq_inbuf
      # against the old formula: 100k states, ~44k true. Falsified on
      # 2026-10-16: sc compared against sb_a, and sb_wait dropped, each fail.
      # Also guards the form: an always @* calling in_buf held stale values in
      # simulation (an implicit sensitivity list does not look inside a
      # function), which is why the RTL spells the compare out.
      - name: DDR3 write-drain buffer check matches in_buf (tb_wq_inbuf.sv)
        run: |
          set -euo pipefail
          cd rtl/sim/ddram
          iverilog -g2012 -o tbw ../../ddram_ctrl.v ../../ddr_cmd_pipe.v \
            ../../cpu_cache_new.v \
            ../../A2065/a2065_ddram_arbiter.v ../cache/dpram_sim.v \
            tb_wq_inbuf.sv
          vvp -n tbw | tee out_wq.log
          grep -q "RUN: PASS" out_wq.log

      # ddr_cmd_pipe on its own. The module is there for timing -- it holds one
      # Avalon command for a cycle on its way to the HPS bridge -- so what this
      # proves is that it is invisible to the protocol: 203 commands issued
      # under random back-pressure, each accepted exactly once, in order, with
      # its payload intact.
      #
      # The step above is the integration half of the same check: with the
      # stage in ddram_ctrl it drives real CPU cache fills and bridge DMA
      # reads through it against a slave that asserts waitrequest on its own
      # return cycles.
      - name: DDR3 command pipeline stage
        run: |
          set -euo pipefail
          cd rtl/sim/ddram
          iverilog -g2012 -o tb_pipe ../../ddr_cmd_pipe.v tb_ddr_cmd_pipe.sv
          vvp tb_pipe | tee out_pipe.log
          grep -q "RUN: PASS" out_pipe.log

      # The clk_sys retiming bank AmigaCD.sv puts in front of ss_state_fanout.
      # Three wirings of the same restores -- raw, retimed, and deliberately
      # skewed by a cycle -- at all four clk_sys phases, all required to agree.
      # The retiming is three lines in a file no bench compiles, and what it
      # changes is which vector a restore acts on, which no timing report sees.
      # Also checks the eight MMU register writes (format 1.5) carry TC, TT0,
      # TT1, CRP, SRP and MMUSR at the kernel's indices; CRP's halves swapped
      # and the index off by one each fail it (2026-10-19).
      - name: Restore fan-out vector retiming
        run: |
          set -euo pipefail
          cd rtl/sim/ssfanout
          iverilog -g2012 -I../../.. -o tb ../../ss_state_fanout.sv tb_ss_fanout_retime.sv
          vvp tb | tee out.log
          grep -q "RUN: PASS" out.log

      # cpu_cache_new's fill-vs-snoop interlock. sdram_ctrl drives snoop_act from
      # chipWE, so a change to the chip write path shows up here.
      - name: Cache fill/snoop interlock
        run: |
          set -euo pipefail
          cd rtl/sim/cache
          iverilog -g2012 -o tb_snoop \
            dpram_sim.v ../../cpu_cache_new.v tb_cache_snoop.sv
          vvp tb_snoop | tee out.log
          grep -q "RUN: PASS" out.log

      # hps_ext's save state diagnostic sub-channel (UIO class 0xF600). Drives
      # EXT_BUS the way sys/hps_io.sv does and checks the word order and class
      # decode against the real module, because the byte_cnt alignment the host
      # poller depends on is a convention that appears nowhere in the source.
      - name: hps_ext save state diagnostics
        run: |
          set -euo pipefail
          cd rtl/sim/hps_ext
          iverilog -g2012 -o tb_ssdiag ../../../hps_ext.v tb_hps_ext_ssdiag.sv
          vvp tb_ssdiag | tee out.log
          grep -q "RUN: PASS" out.log

      # cdtv_bridge's CR-511 command/reply surface and TPI Port C shapes. Ten
      # checks, including the 2026-05-21 byte-lane fix and the mode-0 Port C
      # value that a pre-fix bug got wrong.
      #
      # These two benches shipped with ModelSim .do runners and were never run
      # here, so they silently stopped compiling at the b265a3b merge: it moved
      # the command stream onto the ext bus and deleted ac_rom_*, cmd_in_*,
      # cmd_out_*, sec_byte_* and trace_* from the module. Being in CI is the
      # point -- the RTL they cover is the CDTV path, which is the part of this
      # core that is hardest to exercise by hand.
      - name: CDTV CR-511 command surface
        run: |
          set -euo pipefail
          cd rtl/sim/cdtv
          iverilog -g2012 -o tb_cr511 -s tb_cdtv_cr511             tb_cdtv_cr511.sv ../../cdtv_bridge.v ../cache/dpram_sim.v
          vvp tb_cr511 | tee out_cr511.log
          grep -q "RUN: PASS" out_cr511.log

      # The STCH interrupt path, including the raise-versus-AIR-read collision
      # across twelve phase offsets. STCH must fire only on cd_media
      # transitions; an earlier FSM pulsed it on every command and regressed the
      # M1 splash, which is the class of error this catches.
      - name: CDTV TPI STCH delivery
        run: |
          set -euo pipefail
          cd rtl/sim/cdtv
          iverilog -g2012 -o tb_tpi -s tb_cdtv_tpi_stch             tb_cdtv_tpi_stch.sv ../../cdtv_bridge.v ../cache/dpram_sim.v
          vvp tb_tpi | tee out_tpi.log
          grep -q "RUN: PASS" out_tpi.log

      # agnus_beamcounter's light pen latch. VPOSR/VHPOSR used to be a plain mux
      # on the userspace-supplied position, so BPLCON0 bit 3 froze the beam
      # counters for as long as it stayed set and every beam-wait loop hung --
      # with no gun connected they froze at zero, so it hung with no light pen
      # in the room. The bench counts distinct VHPOSR values across a frame;
      # against the old code that count is 1.
      #
      # It also pins down 2764b51's readback delay and where it may be applied:
      # the live vertical readback must be vpos held one colour clock, and a pen
      # freeze must still report the userspace-supplied position undelayed.
      # Both directions were falsified on 2026-09-14 -- dropping the delay fails
      # the lag check, moving it onto the frozen path fails the three freeze
      # checks -- so a future upstream merge cannot quietly put it on the wrong
      # side of that split.
      - name: Light pen latch
        run: |
          set -euo pipefail
          cd rtl/sim/lightpen
          iverilog -g2012 -o tb ../../agnus_beamcounter.v tb_lightpen_latch.sv
          vvp tb | tee out.log
          grep -q "RUN: PASS" out.log

      # a2065_ddram_arbiter's busy-clear compare was rewritten to take the late
      # f2sdram readdatavalid out of the adder in front of it (-0.91 ns at one
      # seed). This proves every output, plus busy / beats_left / owner,
      # cycle-identical to the previous version (frozen as
      # a2065_ddram_arbiter_ref.v) against a slave driven at random, so
      # beats_left also visits the wrapped values a real slave never produces.
      # Falsified on 2026-10-16: the two compares swapped, the select dropped,
      # and a sum one bit too narrow (the original compare is 32 bits wide, so
      # it never wrapped) each fail it.
      - name: A2065 DDR3 arbiter matches its previous version (tb_a2065_arbiter_equiv.sv)
        run: |
          set -euo pipefail
          cd rtl/sim/a2065arb
          iverilog -g2012 -o tb ../../A2065/a2065_ddram_arbiter.v a2065_ddram_arbiter_ref.v tb_a2065_arbiter_equiv.sv
          vvp -n tb | tee out.log
          grep -q "RUN: PASS" out.log

      # The SDRAM CPU port claim (freeze | peek_scan) is now ss_ctrl's own
      # register, port_own, loaded with the next values of both, so it leaves a
      # flop instead of a gate on freeze's ~145-load net -- that path into
      # sdram_ctrl's sd_addr was the worst family after the chipset one. This
      # proves port_own equals the OR on every clock and ss_ctrl's outputs equal
      # the previous version's (frozen as ss_ctrl_ref.v / ss_quiesce_ref.v):
      # 1.5M clocks of random saves, loads and peeks, busy stretches that make
      # the freeze time out and SDRAM stalls that make a peek scan time out.
      # Falsified on 2026-10-17: port_own from the current freeze, from the
      # current peek_scan, a peek-scan release forced high, and the freeze
      # granted after a timeout each fail it.
      #
      # Its last 300k clocks are a second check. ss_ctrl now holds fast_ena for
      # the whole of a transfer (an OSD ApplyConfiguration can change the memory
      # config under a running save without resetting ss_ctrl), so there it
      # moves fast_ena on every clock and requires the payload length not to
      # change mid-transfer. Falsified on 2026-10-18: following fast_ena live
      # fails it ~100k times.
      #
      # Third, it checks the shadow readback's address age: at every read of
      # shadow_rd_data (S_SHADOW_LOW's last hold cycle, S_SHADOW_Q) the address
      # must have been on the port for at least 5 clk_114 cycles (up to 4 to
      # reach a clk_sys edge, where ss_regshadow registers the read, and one
      # more for the value to arrive); it reports the shortest (6)
      # and fails on zero reads. Falsified on 2026-10-19: S_SHADOW_LOW going
      # straight to S_SHADOW_Q (a read 1 clock after the address moves), and a
      # required age of 7, each fail it.
      - name: Save-state port claim register matches freeze | peek_scan (tb_ss_port_own.sv)
        run: |
          set -euo pipefail
          bash rtl/sim/check-icarus-warnings.sh -g2012 -o tb_ss_port_own rtl/sim/ssown/tb_ss_port_own.sv rtl/ss_ctrl.v rtl/ss_quiesce.v rtl/ss_serdes.v rtl/ss_dma.v rtl/ss_crc32.v rtl/sim/ssown/ss_ctrl_ref.v rtl/sim/ssown/ss_quiesce_ref.v
          vvp -n tb_ss_port_own | tee out_ss_port_own.log
          grep -q "RUN: PASS" out_ss_port_own.log

      # CIA-B's port B pins (drive select, motor) now come straight off a
      # register loaded with their NEXT value: the port expression applied to
      # the next-state logic of DDRB, PRB and both timers, and amiga_clk's next
      # eclk. Through Paula's floppy DMA request, Agnus and Gary those pins reach
      # sdram_ctrl's sd_addr inside half a 7 MHz cycle, and CIA-B was the worst
      # source of that path in the 68030 netlist (-1.45 ns on seed 8). This
      # proves the module identical to the previous one (frozen as ciab_ref.v,
      # with its timers) on every output and every clock: 2M clocks of random
      # CPU traffic biased to PRB/DDRB/timers with PBON/OUTMODE/cascade, CIA
      # resets, amiga_clk's async reset, the freeze's ce, and save-state loads.
      # Falsified on 2026-10-17: stale eclk, a stale OUTMODE, a stale PRB, a
      # stale cascade select, a stale zero test and a wrong eclk shift condition
      # each fail it. On 2026-10-18 a review found the clock amiga_clk's reset
      # asserts on was not exact (its eclk_n cannot see an asynchronous reset
      # coming; AmigaCD.sv now covers it from reset_d's next state). The bench
      # had missed it at one reset in 100000 clocks; its second half now resets
      # every ~300, and without the fix fails 3 times in 3439 resets.
      - name: CIA-B port B lookahead matches its previous version (tb_ciab_lookahead_equiv.sv)
        run: |
          set -euo pipefail
          cd rtl/sim/ciab
          iverilog -g2012 -o tb tb_ciab_lookahead_equiv.sv ../../amiga_clk.v ../../ciab.v ../../cia_timera.v ../../cia_timerb.v ../../cia_int.v ../../cia_timerd.v ciab_ref.v cia_timera_ref.v cia_timerb_ref.v
          vvp -n tb | tee out.log
          grep -q "RUN: PASS" out.log

      # ss_regshadow's readback is registered end to end: the set/clear select
      # (DMACON/INTENA/ADKCON), which was combinational on rd_addr, now loads on
      # the same clk_sys edge as the array read. As a comb path it ran from
      # ss_ctrl's shadow_rd_addr straight back into ss_ctrl and was L's worst
      # path (AmigaCD.sdc carried a multicycle for it, now removed). This
      # compares the module with the previous version (frozen as
      # ss_regshadow_ref.v): every other output on every clock, and rd_data on
      # every clock where the address and the three registers held across the
      # last edge, which is what ss_ctrl's frozen, held-address readback
      # guarantees. Coverage counters fail on zero. Falsified on 2026-10-19:
      # DMACON for every set/clear entry, the select dropped, the select taken
      # from the replay walk's address, and the value a clock late each fail it
      # (also in rtl/sim/run-mutations.py).
      - name: Shadow readback register matches the comb select it replaced (tb_ss_regshadow_rd_equiv.sv)
        run: |
          set -euo pipefail
          bash rtl/sim/regshadow/run.sh

      # The TG68K takes a RAM read only once the data under it is two clk_114
      # periods old (AmigaCD.sv's cpu_rdgate: ready delayed one clk_114 behind
      # the controller's ack, data ANDed with that condition), which is what
      # AmigaCD.sdc's multicycle from the caches' read data registers into the
      # TG68K rests on. (Row 24, the gate alone: a read acked on the clk_114
      # edge before a clk_sys edge -- every cache hit -- is taken a clk_sys
      # later. The bench's fast-hit checks (G) are behind FAST_HIT, for the
      # variant that acks hits early.) Runs the real sdram_ctrl and ddram_ctrl under AmigaCD.sv's
      # handshake, in all three CPU modes, plus two standalone caches on random
      # inputs: data stable under the gate (A), zero outside it (B), the taken
      # word is the ack word (C), a read's ready exactly one clk_114 behind ack
      # (D), fx68k untouched (E), writes undelayed (F), a fast hit's word equal
      # to what READ would have loaded (G). Coverage counters fail on zero.
      # Falsified on 2026-10-20: the gate without the delayed ack (B), ready not
      # delayed (C, D), the fast path without its RAM-write guard (G), without
      # its address compare (G), on a miss (G), and the cache reloading its
      # data in WAIT (A) each fail it.
      - name: CPU read return gate and fast cache hits (tb_cpu_rdgate.sv)
        run: |
          set -euo pipefail
          bash rtl/sim/rdgate/run.sh

      # drive_sounds registers the DDR3 read data (dd_q) before its 4:1 sample
      # select, because the HPS port's readdata straight into smp missed setup
      # in 4 of 58 seeds. That costs one clock per read; this proves the module
      # identical, on every output and every clock, to the previous one (frozen
      # as drive_sounds_ref.v) behind a DDR3 port one clock slower -- a latency
      # the port never fixed. Falsified on 2026-10-17: reading the select or the
      # line cache from the live port instead of dd_q, and a wrong word, each
      # fail it (the model drives garbage outside its ready cycle, which is what
      # makes the first two visible).
      - name: drive_sounds matches its previous version a DDR3 clock later (tb_drive_sounds_equiv.sv)
        run: |
          set -euo pipefail
          cd rtl/sim/dsnd
          iverilog -g2012 -o tb ../../drive_sounds.v drive_sounds_ref.v tb_drive_sounds_equiv.sv
          vvp -n tb | tee out.log
          grep -q "RUN: PASS" out.log

      # ss_serdes became a real shift register (it was addressed by count) to
      # take a ~50-way word mux and a per-word count decode off two clk_114
      # paths that missed setup after the 68030 merge. This proves every output
      # cycle-identical to the addressed version (frozen as ss_serdes_ref.v)
      # under random saves, gapped and restarted loads and stray words, at one
      # word (its own generate branch), a ragged top word, and the real vector's
      # size. Falsified on 2026-10-16: words shifted in at the bottom, a save
      # that does not shift, and a broken one-word branch each fail it.
      - name: ss_serdes shift register matches the addressed version (tb_ss_serdes_equiv.sv)
        run: |
          set -euo pipefail
          cd rtl/sim/ssserdes
          for w in 32 77 1530; do
            iverilog -g2012 -Ptb_ss_serdes_equiv.WIDTH=$w -o tb ../../ss_serdes.v ss_serdes_ref.v tb_ss_serdes_equiv.sv
            vvp -n tb | tee out_$w.log
            grep -q "RUN: PASS" out_$w.log
          done

      # sys/yc_out.sv registers the chroma sine values, so the sine ROM sits in
      # front of the register feeding the U/V multipliers. Without that, the
      # 114 MHz fit missed setup by 1.0-1.4 ns on every seed. It began as a local
      # change and is now upstream (Template_MiSTer #120). This proves the
      # output identical to upstream's module from before #120 on every clock (NTSC and PAL,
      # burst and active chroma both exercised and counted), and stops building
      # if a sys/ resync reverts the change -- which would bring the setup
      # failure back with nothing else to say so. Falsified on 2026-10-16: a
      # cos offset of 63, a one-clock-early sine and a PAL burst offset of 161
      # each fail it. Verilator because Icarus 12 cannot parse yc_out.
      - name: yc_out retiming matches upstream (tb_yc_out_equiv.sv)
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq verilator >/dev/null
          cd rtl/sim/yc
          ./run.sh

      # HBSTRT and HBSTOP carry half-a-colour-clock position in bit 10, which the
      # core used to drop. Also asserts that bits 9:8 stay dropped -- they are 35 ns
      # resolution and hpos cannot express them, so a future change that folds them
      # into the compare would move the blanking edge by a whole colour clock.
      - name: Programmable horizontal blanking edges
        run: |
          set -euo pipefail
          cd rtl/sim/beamcounter
          iverilog -g2012 -o tb ../../agnus_beamcounter.v tb_beamcounter_hblank.sv
          vvp tb | tee out.log
          grep -q "RUN: PASS" out.log

      # HHPOSR ($1DA) was not decoded at all. It is the horizontal half of VHPOSR
      # on its own, ECS only, and it honours the light pen freeze -- so this also
      # guards the equality between the two readbacks, which is only true because
      # BEAMCON0 DUAL mode is not implemented here.
      - name: HHPOSR readback
        run: |
          set -euo pipefail
          cd rtl/sim/beamcounter
          iverilog -g2012 -o tb_hh ../../agnus_beamcounter.v tb_beamcounter_hhposr.sv
          vvp tb_hh | tee out_hh.log
          grep -q "RUN: PASS" out_hh.log

      # The beam readback against an independently written implementation.
      # rtl/sim/beamcounter/beam-reference.tsv is generated from Copperline (a
      # cycle-driven Amiga emulator in Rust) by tools/copperline-beamtable.sh.
      # CI never needs Copperline -- only regenerating the table does, and the
      # table is committed.
      #
      # This exists because docs/core-accuracy-todo.md opens by saying we cannot
      # measure against real hardware, which is what left T7 at [SUITE]: needing
      # a MiSTer, a screen and a person reading it. A second implementation is
      # not silicon, but it is a second opinion, and it is one a machine can
      # read.
      #
      # What it would catch: the two halves of the vertical readback coming from
      # different instants, and the horizontal readback offset moving. Both were
      # confirmed by mutation -- reading VPOSR from the live counter while VHPOSR
      # reads vpos_rb reproduces the reference implementation's own frame-wrap
      # split, and the bench names it.
      #
      # Runs from the bench directory: the table is opened by relative path.
      - name: Beam readback vs the Copperline reference table
        run: |
          set -euo pipefail
          cd rtl/sim/beamcounter
          iverilog -g2012 -o tb_ref ../../agnus_beamcounter.v tb_beamcounter_reference.sv
          vvp tb_ref | tee out_ref.log
          grep -q "RUN: PASS" out_ref.log

      # NTSC lines are 227.5 colour clocks, produced by alternating 227 and 228.
      # long_line toggled for years with nothing consuming it. Also guards the
      # cases that must NOT alternate -- PAL, BEAMCON0 PAL and LOLDIS.
      - name: NTSC long lines
        run: |
          set -euo pipefail
          cd rtl/sim/beamcounter
          iverilog -g2012 -o tb_ll ../../agnus_beamcounter.v tb_beamcounter_longline.sv
          vvp tb_ll | tee out_ll.log
          grep -q "RUN: PASS" out_ll.log

      # denise_sprites_shifter's SPRxDATx write vs shift-register load ordering.
      # A bus write landing exactly on the SPRxPOS match used to always reach
      # that line's copy; real Denise decides by SPRxCTL bit 0 (WinUAE
      # 1e47b230). Sixteen cells, of which only the two collision ones changed
      # when the fix landed -- the other eleven are the guard that it moved
      # nothing else, which is the half of this that is easy to break.
      #
      # Falsified 2026-09-14 against three mutations: the pre-fix load (fails
      # the two bit0=0 collision checks), dropping the bit-0 term (fails the
      # two bit0=1 ones), and swapping the per-register selects (fails the two
      # bit0=0 ones). Each is caught by the checks that name it.
      - name: Sprite SPRxDATx write ordering
        run: |
          set -euo pipefail
          cd rtl/sim/sprites
          iverilog -g2012 -o tb ../../denise_sprites_shifter.v tb_sprite_write_order.sv
          vvp tb | tee out.log
          grep -q "RUN: PASS" out.log

      # Denise holding->shift copy against the hardware comparator (WinUAE
      # drawing.cpp `dhv == bplcon1_shift_full`). Asserted: the on-grid cells in
      # every mode, AGA FMODE 0 off-grid cells, and the mid-line BPLCON1 cases on
      # OCS and AGA -- T28's fix. OCS and AGA FMODE 1/3 off-grid cells are
      # printed only (T28 explains why FMODE 1/3 is not asserted).
      # The bench must be listed BEFORE the RTL: denise_bitplanes.v uses `#1`
      # with no timescale of its own.
      - name: Denise scroll copy (T28)
        run: |
          set -euo pipefail
          cd rtl/sim/denise
          iverilog -g2012 -o tb tb_denise_scroll_copy.sv ../../amiga_clk.v ../../denise_bitplane_shifter.v ../../denise_bitplanes.v
          vvp tb | tee out.log

      # A sprite pair is attached by the odd sprite's AT bit only (vAmigaTS
      # Denise/Sprites/attached/attached2, attached5; A500 OCS and ECS photos).
      - name: Sprite attach by the odd AT bit only
        run: |
          set -euo pipefail
          cd rtl/sim/sprites
          iverilog -g2012 -o tb_att ../../denise_sprites.v ../../denise_sprites_shifter.v tb_sprite_attach.sv
          vvp tb_att | tee out_att.log
          grep -q "RUN: PASS" out_att.log

      # AGA SPRxCTL SH1/SH0 (70/35 ns) move the whole sprite: with SH = k the
      # serial output is the SH = 0 output delayed k clk28, in lores, hires and
      # super hires, with CTL bit 0 clear and set; OCS/ECS ignore the bits.
      # Upstream #260 delayed only the load, which loses a shift step in lores
      # and hires -- a one-pixel gap at every sprite edge (Flink CD32 title).
      #
      # Falsified 2026-10-18: the #260 load-delay shifter fails 10 of 48 checks
      # (lores and hires, super hires passes); the output tap moved the wrong way
      # fails 18; ignoring the fine bits at the tap fails 18.
      - name: Sprite fine horizontal start (AGA SH1/SH0)
        run: |
          set -euo pipefail
          cd rtl/sim/sprites
          iverilog -g2012 -o tb_fine ../../amiga_clk.v ../../denise_sprites_shifter.v tb_sprite_fine_start.sv
          vvp tb_fine | tee out_fine.log
          grep -q "RUN: PASS" out_fine.log

      # A line blit with a BLTSIZE width of 1 must finish. The blitter spends two
      # words per line pixel; with width 1 the last word can land in L2, where the
      # end was never tested, and the height counter wrapped -- ~32767 pixels of
      # busy (vAmigaTS irqtim1l/11l1/15l1, timing11l1 on an A500). Width 2 is
      # printed as the reference.
      - name: Blitter line mode, BLTSIZE width 1
        run: |
          set -euo pipefail
          cd rtl/sim/blitter
          iverilog -g2012 -o tbb tb_blit_line.sv ../../amiga_clk.v ../../agnus*.v
          vvp tbb | tee out.log
          grep -q "RUN: PASS" out.log

      # Line mode honours USEB: B is fetched per pixel and is the texture
      # (vAmigaTS Agnus/Blitter/line/channels1, channels2).
      - name: Blitter line mode channel B
        run: |
          set -euo pipefail
          cd rtl/sim/blitter
          iverilog -g2012 -o tbbc tb_blit_line_channels.sv ../../amiga_clk.v ../../agnus*.v
          vvp tbbc | tee out_ch.log
          grep -q "RUN: PASS" out_ch.log

      # The blitter pointer bank is read at ptrsel instead of at its write select,
      # which followed Agnus's register bus and dma_ack -- the DMA priority mux --
      # and put every arbitration input on the path to sdram_ctrl's sd_addr
      # (docs/seed-lottery.md, family A). This proves the whole agnus identical
      # to the previous version (frozen as *_ref.v) on every clock: random
      # blits, line mode included, against disk, audio, bitplane and sprite
      # DMA, OCS/ECS and AGA, two seeds each. It fails on zero grants, zero
      # line-mode grants, zero L3 first-pixel cycles, zero cycles where the two
      # selects differ, zero slots for any competing DMA, and on any X on a
      # compared output. Falsified on 2026-10-18: the low word read from the
      # paired channel, the high word read from channel C on modulo cycles, and
      # channel A read as B on modulo-only cycles (line-mode L1) each fail it.
      - name: Blitter pointer read off the DMA mux (tb_bltrd_equiv.sv)
        run: |
          set -euo pipefail
          cd rtl/sim/bltrd
          ./run.sh

      # cpu_cache_new's sdram read request has its own expression instead of
      # an assignment inside the cpu-side state machine, so the tag compares
      # feed its last LUT instead of the shared next-state decode: tag RAM ->
      # sdr_read_req was the worst path of ram2's cache, families F and H, in
      # docs/seed-lottery.md. This proves the module identical to the previous
      # version (frozen as cpu_cache_new_ref.v) on every output on every clock:
      # random reads, fetches, writes and long reads over a small line set with
      # evictions, snoops, inhibit, cache enable / D-cache toggles and clears,
      # line buffer offers, and a memory acking fills after a random delay.
      # LINE_TAKE 0 (ram1) and 1 (ram2), two seeds each. It fails on zero
      # misses, zero held requests, zero hits on any of the four ways, and (ram2)
      # zero buffer takes or zero buffer offers refused for a snoop. Falsified
      # on 2026-10-18: the FILL1 hold ignoring the ack, a way-1 D hit not
      # counted as a hit, and the buffer term ignoring snoop_act each fail it.
      - name: Cache read request off the state decode (tb_cache_req_equiv.sv)
        run: |
          set -euo pipefail
          cd rtl/sim/cachereq
          ./run.sh

      # Who owns each DMA slot on a copper-busy line, in every bitplane fetch
      # mode, against Copperline's cycle trace of the same copper list. Added
      # after the Turrican 2 AGA report (copper finishing a split late): a copper
      # that lost slots to bitplane DMA in some fetch mode would do that. All 224
      # colour clocks $00-$DF match on all five lines; the line wrap is reported
      # only. The whole agnus.v runs; the bench is listed first for the timescale.
      - name: Copper DMA slots vs Copperline
        run: |
          set -euo pipefail
          cd rtl/sim/copper
          python3 gen_copslots.py copslots.memh
          iverilog -g2012 -o tbs tb_copper_slots.sv ../../amiga_clk.v ../../agnus*.v
          vvp tbs
          python3 check_copslots.py | tee out_slots.log
          grep -q "RUN: PASS" out_slots.log

      # Bitplane DMA must stop entirely when BPLCON0 asks for more planes than
      # the fetch mode and resolution carry -- not fetch the first N. Real A1200:
      # vAmigaTS AGADDF agaddf1-14. Same bench, a different copper list.
      - name: Bitplane plane limit per fetch mode
        run: |
          set -euo pipefail
          cd rtl/sim/copper
          python3 gen_planelimit.py planelimit.memh
          iverilog -g2012 -o tbs tb_copper_slots.sv ../../amiga_clk.v ../../agnus*.v
          vvp tbs +memh=planelimit.memh +out=planelimit_sim.txt +all
          python3 check_planelimit.py | tee out_pl.log
          grep -q "RUN: PASS" out_pl.log

      # DDFSTRT == DDFSTOP on ECS/AGA: reached while idle the fetch runs to the
      # hardware stop, reached while running it stops one unit later (vAmigaTS
      # Agnus/DDF/DDF/doublematch1, A500 ECS and A1200). Same bench again.
      - name: DDF double match, idle and running
        run: |
          set -euo pipefail
          cd rtl/sim/copper
          python3 gen_ddfdouble.py ddfdouble.memh
          iverilog -g2012 -o tbs tb_copper_slots.sv ../../amiga_clk.v ../../agnus*.v
          vvp tbs +memh=ddfdouble.memh +out=ddfdouble_sim.txt +all
          python3 check_ddfdouble.py ddfdouble_sim.txt | tee out_dd.log
          grep -q "RUN: PASS" out_dd.log

      # Every line of a frame reads back its own line number, PAL and NTSC. The
      # other beamcounter benches each pin one feature and none of them sweeps a
      # frame, so a vertical readback that reports the same line forever, or that
      # drops the top three bits above line 255, would pass all of them. Both
      # failures are silent -- every value returned is a plausible line number.
      #
      # Added while running the vAmigaTS VPOS suite for T7, where probe1, probe2
      # and ersy1 on hardware all reported line 49 for lines 224-254. This bench
      # passes, which is what makes it worth keeping: agnus_beamcounter is not
      # where that comes from, and this holds that answer still.
      - name: VPOSR/VHPOSR report every line of a frame
        run: |
          set -euo pipefail
          cd rtl/sim/beamcounter
          iverilog -g2012 -o tb_vp ../../agnus_beamcounter.v tb_beamcounter_vposr_sweep.sv
          vvp tb_vp | tee out_vp.log
          grep -q "RUN: PASS" out_vp.log

      # The copper had no bench at all, which left the one part of Agnus that
      # every Amiga program steers the display with uncovered: a WAIT firing on
      # the wrong line, or once and then never again, passed CI in full.
      #
      # Drives the real beamcounter into the real copper, wired as agnus.v wires
      # them, and runs probe1's actual list from the vAmigaTS VPOS suite --
      # sixteen WAITs, one every second line from $E0 to $FE. On hardware that
      # list lost fifteen of its sixteen writes. Here all sixteen release on
      # their own line, so the copper's WAIT is not where that comes from.
      #
      # Runs that list three ways: with every slot granted, with the real
      # agnus_bitplanedma competing as probe.i configures it, and once more
      # writing INTREQ through paula_intcontroller so each of the sixteen
      # becomes a level 1 request. All pass, so neither slot contention nor the
      # interrupt controller accounts for what the hardware did.
      #
      # The contention case asserts a bitplane DMA cycle count before it will
      # pass. It has already been vacuous twice -- once from a bus race in the
      # harness and once from the timescale trap below -- and a vacuous run
      # reads exactly like a real one.
      - name: Copper WAIT fires on the line it names
        run: |
          set -euo pipefail
          cd rtl/sim/copper
          # The bench file MUST come first. agnus_bitplanedma.v has no
          # `timescale of its own and writes every register with <= #1, so
          # compiled after a file that sets one it inherits the default
          # instead, its NBAs land outside the run, and every register write
          # to it silently does nothing -- it sits with all registers at zero
          # looking like configured hardware with nothing to do. Putting the
          # bench first applies its 1ns/1ps to the RTL that follows.
          iverilog -g2012 -o tb tb_copper_wait.sv             ../../agnus_beamcounter.v ../../agnus_copper.v             ../../agnus_bitplanedma.v ../../paula_intcontroller.v
          vvp tb | tee out.log
          grep -q "RUN: PASS" out.log

      # Whole-Agnus integration. The isolated benches above all pass, so this
      # runs probe1's copper list against the real agnus.v, where refresh,
      # disk, audio, sprite, bitplane, copper and blitter arbitrate through the
      # actual priority chain and the CPU gets the bus only on cycles no channel
      # claims. Refresh is the specific gap it closes -- it takes the first
      # slots of every line ahead of everything and nothing else modelled it.
      #
      # Bus wiring is copied from the machine, not invented: gary.v:141 gives
      # Agnus chip RAM on its own DMA slots and the CPU's data otherwise, and
      # Paula sits on reg_address_out as minimig.v wires it.
      #
      # Asserts refresh and bitplane cycle counts before it will pass. A bench
      # whose register writes silently went nowhere reads exactly like a
      # working one -- that has happened twice here already.
      - name: Agnus arbitration carries the copper's INTREQ writes
        run: |
          set -euo pipefail
          cd rtl/sim/agnus
          # Bench first: see the timescale note on the copper bench above.
          iverilog -g2012 -o tb tb_agnus_copper_int.sv             ../../agnus*.v ../../paula_intcontroller.v
          vvp tb | tee out.log
          grep -q "RUN: PASS" out.log

      # ADKCON attach: one audio channel modulating the next. Covers both
      # directions of the old failure -- the modulator being heard when it should
      # be silent, and the modulation not happening -- plus channel 3, which is
      # silenced by its attach bits even though it has nothing to modulate.
      - name: Paula audio channel modulation
        run: |
          set -euo pipefail
          cd rtl/sim/paula
          iverilog -g2012 -o tb             ../../paula_audio.v ../../paula_audio_channel.v             ../../paula_audio_mixer.v ../../paula_audio_volume.v             tb_paula_audio_attach.sv
          vvp tb | tee out.log
          grep -q "RUN: PASS" out.log

      # cpu_wrapper's save state park, CPU speed and chip-slot guard.
      # All three are things an upstream merge can remove without anyone
      # noticing, and the park came within one conflict resolution of exactly
      # that at 74d6ce0. The two CPU cores are stubbed -- see cpu_core_stubs.v.
      # Since upstream 26eb46a the speed is cpu_cycles.v's cycle model: the
      # bench holds the unthrottled 68020 (CPU Turbo On) to running free and
      # requires the park in every CPU mode. Falsified 2026-10-16 by putting
      # the 68020 on the stock-speed model (Turbo On then held 35 cycles).
      - name: CPU wrapper park and throttle
        run: |
          set -euo pipefail
          cd rtl/sim/cpuwrap
          iverilog -g2012 -I ../.. -o tb             ../../cpu_wrapper.v ../../memory_router.v ../../cpu_cycles.v             cpu_core_stubs.v tb_cpu_wrapper_park.sv
          vvp tb | tee out.log
          grep -q "RUN: PASS" out.log

      # ECS super hires colour: register 5 * v and the sub-pixel average
      # (vAmigaTS Denise/Modes/shres, A500+ photographs).
      - name: Denise ECS super hires colour
        run: |
          set -euo pipefail
          cd rtl/sim/denise
          iverilog -g2012 -o tb_shres ../../denise_shres_ecs.v tb_denise_shres_ecs.sv
          vvp tb_shres | tee out_shres.log
          grep -q "RUN: PASS" out_shres.log

      # OCS/ECS dual playfield: an invalid priority code (PFxP > 4) draws that
      # playfield in COLOR00 but keeps it opaque. Every pixel x BPLCON2 value
      # against vAmiga's translateDPF (vAmigaTS Denise/Registers/BPLCON2/dualpf*).
      - name: Denise dual playfield invalid priority
        run: |
          set -euo pipefail
          cd rtl/sim/denise
          iverilog -g2012 -o tb_dpf ../../denise_playfields.v tb_dpf_priority.sv
          vvp tb_dpf > dpf.txt
          python3 check_dpf_priority.py dpf.txt | tee out_dpf.log
          grep -q "RUN: PASS" out_dpf.log

      # Three of the four things ciaa.v's 2005 header lists as not implemented:
      # CIA-A's port B, PB6/PB7 driven by the timers, and CIA-B's serial data
      # register. The fourth is the CNT count-source selects, which stay
      # unimplemented and are guarded by their own step above.
      - name: CIA port B, PB6/PB7 and the CIA-B serial register
        run: |
          set -euo pipefail
          cd rtl/sim/cia
          iverilog -g2012 -o tb             ../../ciaa.v ../../ciab.v ../../cia_timera.v ../../cia_timerb.v             ../../cia_int.v ../../cia_timerd.v tb_cia_leftovers.sv
          vvp tb | tee out.log
          grep -q "RUN: PASS" out.log

      # CIA-B serial input clocked from the SP/CNT pins, which are the parallel
      # port's BUSY/POUT and port A bits 0/1 (vAmigaTS CIA/CIA/ser/ser1, ser2).
      - name: CIA-B serial input from BUSY/POUT
        run: |
          set -euo pipefail
          cd rtl/sim/cia
          iverilog -g2012 -o tb_ser ../../ciab.v ../../cia_timera.v ../../cia_timerb.v ../../cia_int.v ../../cia_timerd.v tb_ciab_serial_in.sv
          vvp tb_ser | tee out_ser.log
          grep -q "RUN: PASS" out_ser.log

      # The TOD alarm fires on the clock TOD becomes equal to the alarm, whether a
      # count or a write made it equal (vAmigaTS todvice/0alarm and 1alarm).
      - name: CIA TOD alarm on write and on count
        run: |
          set -euo pipefail
          cd rtl/sim/cia
          iverilog -g2012 -o tb_tod tb_cia_tod_alarm.sv ../../cia_timerd.v
          vvp tb_tod | tee out_tod.log
          grep -q "RUN: PASS" out_tod.log

      # The drive _READY line. Covers the fix (a spinning empty drive must not
      # report ready) and, just as importantly, the 2008 behaviour it must not
      # break: _READY still answers _SEL with the motor stopped.
      - name: Floppy drive ready
        run: |
          set -euo pipefail
          cd rtl/sim/floppy
          iverilog -g2012 -o tb -I ../..             ../../paula_floppy.v ../../MiSTerFloppy*.v ../../paula_floppy_fifo.v             tb_floppy_ready.sv
          vvp tb | tee out.log
          grep -q "RUN: PASS" out.log

      # TG68KdotC_Kernel's savestate restore. VHDL, so GHDL rather than Icarus.
      # The bench boots the kernel from reset vectors, freezes it at 80
      # successive clocks across one pass of a test program, restores the whole
      # architectural state through the ss_* write ports and checks that the
      # CPU comes back at the restored PC. Without ss_resume only a fifth of
      # those freeze points survive, which is the bug this covers; the run
      # prints the per-freeze-point map either way.
      #
      # PHASE 5 covers two refusals added 2026-10-18 from hand-poked programs:
      # the master stack flag AmigaCD.sv refuses a save on (low on the test
      # program, raised by MOVEC to MSP and by setting M, cleared by reset), and
      # a restore out of a CPU halted on a double address error, which used to
      # time out every time. Falsified: dropping either flag trigger, or the
      # halt clear from the ss_resume re-seed, fails the check that names it.
      # PHASE 6: SFC and DFC, in the state vector since 2026-10-18, show on the
      # capture export after MOVEC and come back on the restore's CACR write.
      # Falsified: SFC not restored, and SFC/DFC swapped, each fail it.
      # PHASE 7: the rest of CACR (ss_cacr_hi: the 68030's bits 4, 8, 9, 12, 13
      # and the D-cache heuristic pair), in the vector since 2026-10-19. Falsified
      # on the 68030 run below: the restore's 68030 mask dropped, CACR_DC_owned
      # not restored, and two export bits swapped each fail it.
      #
      # Runs from the repo root: the testbench opens its program image by a
      # path relative to the working directory.
      - name: TG68K savestate restore
        run: |
          set -euo pipefail
          bash rtl/sim/tg68k/run.sh

      # The same bench with the kernel as cpu_wrapper runs it for "68030 no
      # MMU" (CPU030 high, MMU030 low), which save states are allowed on since
      # 2026-10-19. The whole freeze-point scan runs again on the 68030 decode,
      # and PHASE 7 checks the 68030 half of the CACR restore: its upper bits
      # come back and bits 3:2, clear strobes there, are masked as MOVEC masks
      # them. Its own work directory, so the two elaborations do not collide.
      - name: TG68K savestate restore, 68030 no MMU
        run: |
          set -euo pipefail
          WORKDIR=build/ghdl030 bash rtl/sim/tg68k/run.sh -gCPU030_G=1

      # And the 68030 with its MMU (MMU030 high), which save states carry since
      # format 1.5. The freeze-point scan runs a third time, and PHASE 8 runs:
      # two page tables, a machine whose ATC holds a mapping that the restored
      # machine's tables contradict, and the restored machine must read through
      # the restored tables. That needs the MMU registers to arrive (through
      # the kernel's stage, applied on ss_resume) AND the ATC to be flushed --
      # the ATC is not keyed by the root pointer. Falsified on 2026-10-19: the
      # ATC flush removed, the stage never applied, the MMU written straight
      # rather than staged, and CRP exported from SRP each fail the check that
      # names them.
      - name: TG68K savestate restore, 68030 with MMU
        run: |
          set -euo pipefail
          WORKDIR=build/ghdlmmu bash rtl/sim/tg68k/run.sh -gCPU030_G=1 -gMMU_G=1

      # The save state register bus through the real minimig: the snoop tap,
      # the replay mux, the replay's register-decode tick and the memory map
      # bits. This is the only bench that elaborates minimig.v itself, so it is
      # also the only one that can see whether a replay actually lands in
      # agnus, paula and denise rather than merely appearing on their pins.
      # Both bugs it was written to look for were real: nothing landed at all
      # while the machine was frozen, and agnus ignored the mux entirely
      # because it decodes the register address it generates itself.
      - name: Save state register bus through minimig
        run: |
          set -euo pipefail
          bash rtl/sim/ssmux/run.sh

      # Akiko's savestate ports: the idle rule that lets the state vector leave
      # the staging buffers out, the capture-side bit offsets, and a full
      # capture/reset/restore round trip. Needs the dpram model under
      # rtl/sim/cache/, because akiko_nvram.v instantiates bram.vhd's dpram and
      # Icarus has no VHDL -- which is why the rest of the akiko benches are
      # still ModelSim-only.
      - name: Akiko save state
        run: |
          set -euo pipefail
          bash rtl/sim/check-icarus-warnings.sh -g2012 -I. -o tb_akiko_ss             rtl/akiko.v rtl/akiko_nvram.v             rtl/sim/cache/dpram_sim.v rtl/sim/akiko/tb_akiko_savestate.sv
          vvp tb_akiko_ss | tee out_akiko_ss.log
          grep -q "RUN: PASS" out_akiko_ss.log

      # The PBX engine: where each delivered sector lands in chip RAM, and
      # what happens to a ship that is still running when the BIOS starts
      # the next READ DATA. Test H is the Chuck Rock boot hang -- a stale
      # ship used to clear the BIOS's slot offer and raise CDINT_PBX, so the
      # BIOS read the previous read's sector as the head of the file it was
      # loading, with every byte the host delivered correct and in order.
      - name: Akiko PBX DMA
        run: |
          set -euo pipefail
          bash rtl/sim/check-icarus-warnings.sh -g2012 -I. -o tb_akiko_pbx rtl/akiko.v rtl/akiko_nvram.v rtl/sim/cache/dpram_sim.v rtl/sim/akiko/tb_akiko_pbx_dma.sv
          vvp tb_akiko_pbx | tee out_akiko_pbx.log
          grep -q "tb_akiko_pbx_dma PASS" out_akiko_pbx.log

      # The video test pattern's geometry: crosshairs, the grid pitch, and the
      # dark border two pixels in. Generated from the data enables rather than a
      # frame buffer, so an off-by-one in the decode is invisible on a scope and
      # obvious here. This bench existed unreferenced until 2026-09-29.
      - name: Video test pattern geometry
        run: |
          set -euo pipefail
          iverilog -g2012 -o tb_testpattern             rtl/video_testpattern.v rtl/sim/testpattern/tb_video_testpattern.sv
          vvp tb_testpattern | tee out_testpattern.log
          grep -q "RUN: PASS" out_testpattern.log

      # chipdma_arb's read return, against the real sdram_ctrl. The arb samples
      # chipRD_dma four clk_sys cycles after its arming edge with no handshake
      # from sdram_ctrl, which only latches chipRD_dma when the slot it served
      # was a DMA slot. If the two ever disagree the arb acks a byte from an
      # earlier slot -- read-path only, so sector data would stay correct and
      # the one read Akiko does, the command fetch, would be wrong. Every frame
      # carries a different value on sd_data here, so a returned byte names the
      # frame it came from.
      - name: chipdma_arb read return
        run: |
          set -euo pipefail
          python3 rtl/sim/sdram/make_sim_sdram.py
          iverilog -g2012 -o tb_cdma_read             rtl/sim/sdram/sdram_ctrl_sim.v rtl/cpu_cache_new.v             rtl/sim/cache/dpram_sim.v rtl/chipdma_arb.v rtl/memory_router.v             rtl/sim/chipdma/tb_chipdma_read_stale.sv
          vvp tb_cdma_read | tee out_cdma_read.log
          grep -q "tb_chipdma_read_stale PASS" out_cdma_read.log
      # The command channel: what a host read burst does when no command is
      # ready. A drain on a stale REQ used to consume a command the Amiga was
      # still writing, leaving the next frame with a stray leading byte --
      # which swallowed the BIOS's INFO command and stopped it talking.
      - name: Akiko command phantom drain
        run: |
          set -euo pipefail
          bash rtl/sim/check-icarus-warnings.sh -g2012 -I. -o tb_akiko_cmd_phantom rtl/akiko.v rtl/akiko_nvram.v rtl/akiko_hps_bridge.v rtl/sim/cache/dpram_sim.v rtl/sim/akiko/tb_akiko_cmd_phantom.sv
          vvp tb_akiko_cmd_phantom | tee out_akiko_cmd_phantom.log
          grep -q "tb_akiko_cmd_phantom PASS" out_akiko_cmd_phantom.log
      # The TX and RX DMA engines: command bytes fetched out of chip RAM and
      # response bytes written back, the ENABLE and receive_length gates that
      # hold TX off, the post-write inhibit, and the 256-byte index wrap. This
      # bench existed but was never wired in, and it had been red for months:
      # its akiko instance predated dma_arm, so with that input floating no
      # engine was ever claimed and every transfer stalled after one byte.
      # Wired in here so that cannot happen again quietly.
      - name: Akiko TX/RX DMA
        run: |
          set -euo pipefail
          bash rtl/sim/check-icarus-warnings.sh -g2012 -I. -o tb_akiko_txrx             rtl/akiko.v rtl/akiko_nvram.v             rtl/sim/cache/dpram_sim.v rtl/sim/akiko/tb_akiko_txrx_dma.sv
          vvp tb_akiko_txrx | tee out_akiko_txrx.log
          grep -q "tb_akiko_txrx_dma PASS" out_akiko_txrx.log
      # A host response push against a command fetch already on the bus.
      # rx_can_start checked neither tx_busy nor pbx_busy, so a
      # hps_result_done arriving mid-fetch raised rx_busy under an
      # outstanding TX byte: RX won the address mux, took the ack the fetch
      # was waiting for, and the command buffer stored RX's byte at the
      # fetch's index with one byte of the frame never read. On hardware
      # that was the first boot after a core flash, failing every time --
      # 84 00 .. 78 arriving as 44 00 .. 00 right after a media-status push.
      # Test D is the invariant over every cycle, so this cannot pass again
      # merely because a displaced byte carried the right value.
      - name: Akiko host push vs command fetch
        run: |
          set -euo pipefail
          bash rtl/sim/check-icarus-warnings.sh -g2012 -I. -o tb_akiko_push             rtl/akiko.v rtl/akiko_nvram.v             rtl/sim/cache/dpram_sim.v rtl/sim/akiko/tb_akiko_push_vs_tx.sv
          vvp tb_akiko_push | tee out_akiko_push.log
          grep -q "tb_akiko_push_vs_tx PASS" out_akiko_push.log
      # The command fetch against the BIOS's write. The engine must not go
      # looking at the command stream until the write that announced it has
      # landed; fetching early reads the zeros still there and the framer
      # calls two of them a complete opcode-0 frame.
      - name: Akiko TX write race
        run: |
          set -euo pipefail
          iverilog -g2012 -I. -o tb_akiko_tx_write_race rtl/akiko.v rtl/akiko_nvram.v rtl/akiko_hps_bridge.v rtl/sim/cache/dpram_sim.v rtl/sim/akiko/tb_akiko_tx_write_race.sv
          vvp tb_akiko_tx_write_race | tee out_akiko_tx_race.log
          grep -q "tb_akiko_tx_write_race PASS" out_akiko_tx_race.log

      # The Akiko sector channel itself: 1176 words in, 2352 bytes out, at
      # three different strobe spacings. This is upstream's bench for the
      # word-wide ingest, run here against our akiko.v with the savestate
      # ports on it.
      - name: Akiko sector ingest
        run: |
          set -euo pipefail
          iverilog -g2012 -I. -o tb_sec_ingest             rtl/akiko.v rtl/akiko_nvram.v rtl/akiko_hps_bridge.v             rtl/sim/cache/dpram_sim.v rtl/sim/akiko/tb_akiko_sec_ingest.sv
          vvp tb_sec_ingest | tee out_sec_ingest.log
          grep -q "tb_akiko_sec_ingest PASS" out_sec_ingest.log

      # The NVRAM load channel while the CD32 is held in reset. The HPS loads
      # the per-disc save on its first poll, which with the disc in the config
      # at power-on is during reset; the bridge's address counter used to be
      # held at 0 then, every byte landed on address 0, and saves for that
      # disc were refused for the session.
      - name: Akiko NVRAM load during reset
        run: |
          set -euo pipefail
          bash rtl/sim/check-icarus-warnings.sh -g2012 -I. -o tb_bridge_nvr_reset rtl/akiko_hps_bridge.v rtl/sim/akiko/tb_akiko_bridge_nvr_reset.sv
          vvp tb_bridge_nvr_reset | tee out_bridge_nvr_reset.log
          grep -q "tb_akiko_bridge_nvr_reset PASS" out_bridge_nvr_reset.log

      # The CDDA FIFO: PAL/NTSC rate, normal and large depth, flush, the
      # underrun counters, and the decay that replaced stepping to zero.
      - name: CDDA FIFO
        run: |
          set -euo pipefail
          bash rtl/sim/check-icarus-warnings.sh -g2012 -I. -o tb_akiko_cdda rtl/cdda.v rtl/sim/akiko/tb_akiko_cdda.sv
          vvp tb_akiko_cdda | tee out_akiko_cdda.log
          grep -q "tb_akiko_cdda PASS" out_akiko_cdda.log

      # Where each memory region lands in SDRAM. The savestate names chip RAM,
      # slow RAM and the Kickstart by the address sdram_ctrl's CPU port expects,
      # which is not the CPU address -- gary, the bank mapper and the sram
      # bridge between them drop CPU bit 23 and remap two of the three regions.
      # A wrong base reads the wrong memory into the file and writes it back
      # over the right memory, and nothing else in the suite would notice.
      - name: SDRAM region map
        run: |
          set -euo pipefail
          iverilog -g2012 -o tb_membank             rtl/minimig_bankmapper.v rtl/minimig_sram_bridge.v             rtl/sim/membank/tb_membank_map.sv
          vvp tb_membank | tee out_membank.log
          grep -q "RUN: PASS" out_membank.log
